# Rules selected above but deliberately disabled, each for a documented reason (never a
# blanket "too noisy" without justification; correctness rules are never ignored wholesale
# here — read the trail of DTZ005/ASYNC230/S110/G201/TRY201/etc. fixes in this migration).
ignore = [
    # This codebase's error-boundary pattern is a deliberate broad `except Exception` at
    # API/service edges that converts any failure into a safe HTTP error or AI-fallback
    # response; every site still logs (`logger.exception(...)`) or re-raises, so nothing is
    # silently swallowed -- see backend-dev's per-site audit in this same change.
    "BLE001",
    # Raising a plain `Exception` (rather than a bespoke exception hierarchy) is proportionate
    # for a project this size; the call sites that need a *specific* type already raise one.
    "TRY002",
    # Collapsing nested `with` blocks is a style preference, not a correctness concern; most
    # remaining sites are test double-patches (`with patch(...): with patch(...):`) or long
    # async context bodies where flattening the `with` header would hurt readability.
    "SIM117",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection style intentionally calls `Depends(...)`/`File(...)`/etc. in
# argument defaults -- that's the framework's documented pattern, not the mutable-default-
# argument bug B008 is meant to catch. Ruff (unlike flake8-bugbear upstream) has no FastAPI
# awareness, so tell it explicitly to treat these as immutable/singleton calls.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.params.Depends",
    "fastapi.File", "fastapi.params.File",
    "fastapi.Form", "fastapi.params.Form",
    "fastapi.Query", "fastapi.params.Query",
    "fastapi.Path", "fastapi.params.Path",
    "fastapi.Body", "fastapi.params.Body",
    "fastapi.Cookie", "fastapi.params.Cookie",
    "fastapi.Header", "fastapi.params.Header",
    "fastapi.Security", "fastapi.params.Security",
]
