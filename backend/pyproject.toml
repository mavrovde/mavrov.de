[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "-p", "no:warnings",
    "-W", "ignore",
]
markers = [
    "real_llm_seam: opt out of the autouse translation-LLM mock; the test mocks the real fallback fork's transports itself (rule 10 still holds)",
]
filterwarnings = [
    "ignore",
    "ignore:'asyncio.get_event_loop_policy' is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true
# Trace greenlets so lines executed after SQLAlchemy-async awaits (which hop into a
# greenlet) are recorded — otherwise async DB endpoints exercised via httpx/ASGI can
# appear uncovered even though they run.
concurrency = ["thread", "greenlet"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

