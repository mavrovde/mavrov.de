services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mavrov}
      PGPORT: ${POSTGRES_PORT:-5433}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5433}:${POSTGRES_PORT:-5433}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mavrov} -p ${POSTGRES_PORT:-5433}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  ollama:
    image: ollama/ollama:0.5.7
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep nomic-embed-text && ollama list | grep llama3.2 && ollama list | grep 'llama3.2:1b' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 180
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        sleep 5
        # Pull only if not already cached in the persistent ollama_data volume
        # (no re-download on restart; offline-safe once cached).
        ollama list | grep -q 'nomic-embed-text' || ollama pull nomic-embed-text
        ollama list | grep -q 'llama3.2:latest'  || ollama pull llama3.2
        ollama list | grep -q 'llama3.2:1b'       || ollama pull llama3.2:1b
        # Prewarm: load the generation models into memory so the first user
        # request is not a multi-second cold start (kept resident via KEEP_ALIVE).
        ollama run llama3.2 "warmup" >/dev/null 2>&1 || true
        ollama run llama3.2:1b "warmup" >/dev/null 2>&1 || true
        wait
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=3
      - OLLAMA_KEEP_ALIVE=-1
    networks:
      - app-network

  backend:
    image: ${IMAGE_REPO:-ghcr.io/mavrovde/hirefolio}-backend:${IMAGE_TAG:-1.12.0}
    restart: always
    volumes:
      # Persist the saved LinkedIn login session across deploys/restarts
      # (see LINKEDIN_COOKIES_DIR / app.services.linkedin.COOKIES_DIR).
      - linkedin_cookies:/data/linkedin_cookies
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:${POSTGRES_PORT:-5433}/${POSTGRES_DB:-mavrov}
      - OLLAMA_URL=http://ollama:11434
      - GENERATION_MODEL=llama3.2
      - FAST_GENERATION_MODEL=llama3.2:1b
      - OTEL_SDK_DISABLED=true
      - CREWAI_TELEMETRY_OPT_OUT=true
      - HIREFOLIO_GEMINI_API_KEY=${HIREFOLIO_GEMINI_API_KEY}
      # Notification channels (#263): empty = channel off, exactly like SMTP.
      - HIREFOLIO_TELEGRAM_BOT_TOKEN=${HIREFOLIO_TELEGRAM_BOT_TOKEN:-}
      - HIREFOLIO_TELEGRAM_CHAT_ID=${HIREFOLIO_TELEGRAM_CHAT_ID:-}
      - HIREFOLIO_NOTIFY_WEBHOOK_URL=${HIREFOLIO_NOTIFY_WEBHOOK_URL:-}
      - NOTIFY_TIMEOUT_SECONDS=${NOTIFY_TIMEOUT_SECONDS:-10}
      # Transparent translation (#248): same forwarding rule as dev — without
      # these the root .env knobs never reach the container.
      - TRANSLATION_ENABLED=${TRANSLATION_ENABLED:-true}
      - OWNER_LANGUAGE=${OWNER_LANGUAGE:-en}
      # Email (#262): pass-through from .env. Empty SMTP_HOST = sending
      # disabled (the graceful-skip contract). Without these lines the whole
      # DEPLOYMENT.md email section was inert on prod — the settings never
      # reached the app (measured in review: 35 env keys, none SMTP).
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      - SMTP_FROM=${SMTP_FROM:-}
      # Names ONLY (never values) of pre-#141 variables still set on the host, so
      # the backend can warn that they are ignored (#141). A credential never
      # enters the container through this.
      - LEGACY_GEMINI_ENV=${GEMINI_API_KEY:+GEMINI_API_KEY }${GEMINI_ENCRYPTION_KEY:+GEMINI_ENCRYPTION_KEY }${GEMINI_MODEL:+GEMINI_MODEL }${GEMINI_MODEL_FALLBACK:+GEMINI_MODEL_FALLBACK}
      # SECURITY (issue #143): Fernet key encrypting the per-user Gemini API key
      # at rest. Set a strong value in the root .env; generate with
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # Empty leaves values as plaintext (backward compatible; not recommended in prod).
      - HIREFOLIO_GEMINI_ENCRYPTION_KEY=${HIREFOLIO_GEMINI_ENCRYPTION_KEY:-}
      # SECURITY (issue #142): initial admin password. REQUIRED — the backend
      # refuses to seed a login-able default admin when this is empty, so prod
      # can never ship the historical admin/admin login. Set a strong value in
      # the root .env before deploying.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # SECURITY (issue #177): secret that signs/verifies admin JWTs. REQUIRED —
      # the backend refuses to start when this is empty (or still the historical
      # placeholder), so prod can never sign admin tokens with a publicly-known
      # key. Set a strong value in the root .env; generate with:
      #   openssl rand -hex 32
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      # Local/E2E escape hatch ONLY: with no JWT_SECRET_KEY, generate a random
      # per-process secret instead of failing (sessions do not survive a
      # restart). Off by default — never enable it on the prod host.
      - JWT_ALLOW_EPHEMERAL_SECRET=${JWT_ALLOW_EPHEMERAL_SECRET:-false}
      - LINKEDIN_EMAIL=${LINKEDIN_EMAIL:-}
      - LINKEDIN_PASSWORD=${LINKEDIN_PASSWORD:-}
      - LINKEDIN_PUBLIC_ID=${LINKEDIN_PUBLIC_ID:-}
      - LINKEDIN_IMPORT_TOKEN=${LINKEDIN_IMPORT_TOKEN:-}
      - IMPORT_MAX_IMAGE_MB=${IMPORT_MAX_IMAGE_MB:-10}
      # Operational tuning knobs (#207) — same pattern as IMPORT_MAX_IMAGE_MB:
      # forwarded explicitly, defaulting to the literals they replaced, so an
      # unchanged .env reproduces the previous behaviour inside the container.
      - LLM_REQUEST_TIMEOUT_SECONDS=${LLM_REQUEST_TIMEOUT_SECONDS:-300.0}
      - LLM_STREAM_TIMEOUT_SECONDS=${LLM_STREAM_TIMEOUT_SECONDS:-30.0}
      - EMBEDDING_REQUEST_TIMEOUT_SECONDS=${EMBEDDING_REQUEST_TIMEOUT_SECONDS:-30.0}
      - OLLAMA_HEALTHCHECK_TIMEOUT_SECONDS=${OLLAMA_HEALTHCHECK_TIMEOUT_SECONDS:-2.0}
      - OLLAMA_PREFLIGHT_TIMEOUT_SECONDS=${OLLAMA_PREFLIGHT_TIMEOUT_SECONDS:-5.0}
      - OLLAMA_STARTUP_CHECK_TIMEOUT_SECONDS=${OLLAMA_STARTUP_CHECK_TIMEOUT_SECONDS:-10.0}
      - PROFILE_DATA_TIMEOUT_SECONDS=${PROFILE_DATA_TIMEOUT_SECONDS:-5.0}
      - DB_RESTORE_TIMEOUT_SECONDS=${DB_RESTORE_TIMEOUT_SECONDS:-300}
      - IMPORT_MAX_POSTS_JSON_MB=${IMPORT_MAX_POSTS_JSON_MB:-10}
      - IMPORT_MAX_POSTS_PER_REQUEST=${IMPORT_MAX_POSTS_PER_REQUEST:-500}
      # Site identity (#65) — served to the public app via GET /config/site;
      # empty means "use the app default" (see config.py validator), so an
      # unset host variable never blanks the branding.
      - SITE_NAME=${SITE_NAME:-}
      - SITE_URL=${SITE_URL:-}
      - OWNER_NAME=${OWNER_NAME:-}
      - OWNER_HEADLINE=${OWNER_HEADLINE:-}
      - OWNER_DESCRIPTION=${OWNER_DESCRIPTION:-}
      - SOCIAL_LINKS=${SOCIAL_LINKS:-}
      - HIREFOLIO_ANALYTICS_ID=${HIREFOLIO_ANALYTICS_ID:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    image: ${IMAGE_REPO:-ghcr.io/mavrovde/hirefolio}-frontend:${IMAGE_TAG:-1.12.0}
    restart: always
    expose:
      - "80"
      - "4000"
    environment:
      - NODE_ENV=production
      # Allow all hosts: node SSR sits behind two trusted nginx layers, and the
      # Host that reaches it is the internal service name (e.g. "frontend"), not
      # the public host. The reverse proxy already validates the public Host, so
      # host validation here would only break pre-rendered SSR. See server.ts.
      - NG_ALLOWED_HOSTS=*
    depends_on:
      - backend
    networks:
      - app-network

  admin-frontend:
    image: ${IMAGE_REPO:-ghcr.io/mavrovde/hirefolio}-admin-frontend:${IMAGE_TAG:-1.12.0}
    restart: always
    expose:
      - "80"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - app-network

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.0
    container_name: open-webui
    restart: always
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434

    volumes:
      - open-webui_data:/app/backend/data
    depends_on:
      - ollama
    networks:
      - app-network

  proxy:
    image: ${IMAGE_REPO:-ghcr.io/mavrovde/hirefolio}-proxy:${IMAGE_TAG:-1.12.0}
    container_name: global_proxy
    restart: always
    environment:
      # Owner-configurable proxy identity (see .env.example). Defaults preserve
      # the canonical mavrov.de behavior; a forker overrides these in the root .env.
      - PUBLIC_SERVER_NAME=${PUBLIC_SERVER_NAME:-mavrov.de www.mavrov.de}
      - ADMIN_SERVER_NAME=${ADMIN_SERVER_NAME:-admin.mavrov.de admin.localhost}
      # Admin console hardening (#86). Admin ships CLOSED to the public: with an
      # empty ADMIN_ALLOWED_CIDRS only loopback reaches it. Set trusted operator
      # IPs/CIDRs to open it — but ONLY effective with real_ip trusting your front
      # proxy (TRUSTED_PROXY_CIDRS) so $remote_addr is the real client, not the
      # Docker gateway. Never set ADMIN_ALLOWED_CIDRS=0.0.0.0/0 in production.
      - ADMIN_ALLOWED_CIDRS=${ADMIN_ALLOWED_CIDRS:-}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      - REAL_IP_HEADER=${REAL_IP_HEADER:-X-Forwarded-For}
    ports:
      - "80:80"
      - "10443:443"
    depends_on:
      - frontend
      - admin-frontend
      - backend
      - open-webui
    networks:
      - app-network

  # OPTIONAL self-hosted outbound relay (#262) — OFF by default; enable with
  # `docker compose --profile mail up`. When enabled, set SMTP_HOST=mailer,
  # SMTP_PORT=587, SMTP_STARTTLS=false in .env (the relay is reached over the
  # private compose network only; it is NOT exposed on the host).
  # Deliverability is the owner's problem to solve, not this file's to promise:
  # see docs/DEPLOYMENT.md "Self-hosted outbound mail" for the SPF/DKIM/rDNS
  # requirements and the port-25 egress reality on most VPS providers. Most
  # owners should point SMTP_* at an external provider instead.
  mailer:
    image: boky/postfix:v4.2.0
    profiles: ["mail"]
    # No restart policy ON PURPOSE: with an empty MAIL_SENDER_DOMAIN postfix
    # exits at startup, and unless-stopped would crash-loop it silently
    # forever (#296 round 2). Fail once, visibly.
    environment:
      # Empty => postfix refuses to start, which is the honest failure: the
      # profile without a sender domain cannot deliver anything anyway.
      - ALLOWED_SENDER_DOMAINS=${MAIL_SENDER_DOMAIN:-}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
  open-webui_data:
  linkedin_cookies:
